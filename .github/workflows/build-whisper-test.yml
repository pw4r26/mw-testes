name: Prepare Whisper Runtime Test
on:
  push:
    paths:
      - '.github/workflows/build-whisper-test.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ggml-org/whisper.cpp
          path: whisper.cpp
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
      - name: Patch browser runtime for Android medical-context test
        working-directory: whisper.cpp
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('examples/whisper.wasm/emscripten.cpp'); s=p.read_text()
          s=s.replace('#include <thread>','')
          s=s.replace('std::thread g_worker;','std::vector<std::string> g_results(4);')
          s=s.replace('''        if (g_worker.joinable()) {\n            g_worker.join();\n        }\n\n''','')
          marker='    emscripten::function("free",'
          getter='''    emscripten::function("result", emscripten::optional_override([](size_t index) {\n        --index;\n        if (index >= g_results.size()) return std::string();\n        return g_results[index];\n    }));\n\n'''
          if marker not in s: raise SystemExit('Binding marker changed; stopping safely')
          s=s.replace(marker,getter+marker)
          s=s.replace('whisper_full_default_params(whisper_sampling_strategy::WHISPER_SAMPLING_GREEDY)','whisper_full_default_params(whisper_sampling_strategy::WHISPER_SAMPLING_BEAM_SEARCH)')
          # Context only biases decoding; it is not appended to the transcript.
          context='''        static const char * medwork_prompt = "Consulta de saúde do trabalhador. Termos possíveis: dor, parestesia, punho, mão, ombro, coluna lombar, movimentos repetitivos, força de preensão, teste de Phalen, eletroneuromiografia, síndrome do túnel do carpo, ruído, protetor auditivo, zumbido, exposição ocupacional, jornada de trabalho, afastamento.";\n        params.initial_prompt = medwork_prompt;\n        params.carry_initial_prompt = true;\n'''
          anchor='        params.n_threads        = std::min(nthreads, std::min(16, mpow2(std::thread::hardware_concurrency())));'
          if anchor not in s: raise SystemExit('Parameter block changed; stopping safely')
          s=s.replace(anchor,'        params.n_threads        = 1;\n'+context)
          s=s.replace('params.n_threads, std::thread::hardware_concurrency(), whisper_print_system_info());','params.n_threads, 1, whisper_print_system_info());')
          old='''        // run the worker\n        {\n            g_worker = std::thread([index, params, pcmf32 = std::move(pcmf32), is_multilingual]() {\n                whisper_reset_timings(g_contexts[index]);\n                whisper_full(g_contexts[index], params, pcmf32.data(), pcmf32.size());\n                whisper_print_timings(g_contexts[index]);\n                if (is_multilingual) {\n                    free((void*)params.language);\n                }\n            });\n        }'''
          new='''        // run synchronously: Android browser build has no pthread worker\n        {\n            whisper_reset_timings(g_contexts[index]);\n            const int rc = whisper_full(g_contexts[index], params, pcmf32.data(), pcmf32.size());\n            g_results[index].clear();\n            if (rc == 0) {\n                const int n_segments = whisper_full_n_segments(g_contexts[index]);\n                for (int i = 0; i < n_segments; ++i) {\n                    const char * text = whisper_full_get_segment_text(g_contexts[index], i);\n                    if (text) g_results[index] += text;\n                }\n            }\n            whisper_print_timings(g_contexts[index]);\n            if (is_multilingual) free((void*)params.language);\n            if (rc != 0) return rc;\n        }'''
          if old not in s: raise SystemExit('Upstream worker block changed; stopping safely')
          s=s.replace(old,new)
          p.write_text(s)
          c=Path('examples/whisper.wasm/CMakeLists.txt'); x=c.read_text()
          x=x.replace('    -s USE_PTHREADS=1 \\\n','')
          x=x.replace('    -s PTHREAD_POOL_SIZE_STRICT=0 \\\n','')
          x=x.replace('    -s FORCE_FILESYSTEM=1 \\\n','    -s FORCE_FILESYSTEM=1 \\\n    -s ASSERTIONS=2 \\\n')
          c.write_text(x)
          PY
      - name: Build Android medical-context runtime
        working-directory: whisper.cpp
        timeout-minutes: 15
        run: |
          emcmake cmake -S . -B build-em -DWHISPER_WASM_SINGLE_FILE=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-em --config Release -j2
      - name: Publish runtime safely
        run: |
          mkdir -p /tmp/medwork-runtime
          cp whisper.cpp/build-em/bin/libmain.js /tmp/medwork-runtime/libmain.js
          cp whisper.cpp/LICENSE /tmp/medwork-runtime/LICENSE-whisper.cpp.txt
          rm -rf whisper.cpp
          git fetch origin main
          git reset --hard origin/main
          mkdir -p vendor/whisper
          cp /tmp/medwork-runtime/libmain.js vendor/whisper/libmain.js
          cp /tmp/medwork-runtime/LICENSE-whisper.cpp.txt vendor/whisper/LICENSE-whisper.cpp.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add vendor/whisper/libmain.js vendor/whisper/LICENSE-whisper.cpp.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Publica runtime Whisper com contexto medico ocupacional'
            git push origin main
          fi
