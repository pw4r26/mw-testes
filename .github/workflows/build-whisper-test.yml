name: Prepare Whisper Runtime Test
on:
  push:
    paths:
      - '.github/workflows/build-whisper-test.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ggml-org/whisper.cpp
          path: whisper.cpp
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
      - name: Patch browser runtime for Android diagnostics
        working-directory: whisper.cpp
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('examples/whisper.wasm/emscripten.cpp'); s=p.read_text()
          s=s.replace('std::thread g_worker;','std::thread g_worker;\n\nstd::vector<std::string> g_results(4);')
          marker='    emscripten::function("free",'
          getter='''    emscripten::function("result", emscripten::optional_override([](size_t index) {\n        if (g_worker.joinable()) g_worker.join();\n        --index;\n        if (index >= g_results.size()) return std::string();\n        return g_results[index];\n    }));\n\n'''
          s=s.replace(marker,getter+marker)
          old='''                whisper_full(g_contexts[index], params, pcmf32.data(), pcmf32.size());\n                whisper_print_timings(g_contexts[index]);'''
          new='''                whisper_full(g_contexts[index], params, pcmf32.data(), pcmf32.size());\n                g_results[index].clear();\n                const int n_segments = whisper_full_n_segments(g_contexts[index]);\n                for (int i = 0; i < n_segments; ++i) {\n                    const char * text = whisper_full_get_segment_text(g_contexts[index], i);\n                    if (text) g_results[index] += text;\n                }\n                whisper_print_timings(g_contexts[index]);'''
          if old not in s: raise SystemExit('Upstream changed; stopping safely')
          p.write_text(s.replace(old,new))
          c=Path('examples/whisper.wasm/CMakeLists.txt'); x=c.read_text()
          x=x.replace('    -s USE_PTHREADS=1 \\\n','')
          x=x.replace('    -s PTHREAD_POOL_SIZE_STRICT=0 \\\n','')
          # Diagnostic build: expose the exact Emscripten abort instead of generic Aborted().
          x=x.replace('    -s FORCE_FILESYSTEM=1 \\\n','    -s FORCE_FILESYSTEM=1 \\\n    -s ASSERTIONS=2 \\\n    -s SAFE_HEAP=1 \\\n    -s STACK_OVERFLOW_CHECK=2 \\\n')
          c.write_text(x)
          PY
      - name: Build diagnostic runtime
        working-directory: whisper.cpp
        run: |
          emcmake cmake -S . -B build-em -DWHISPER_WASM_SINGLE_FILE=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build-em --config RelWithDebInfo -j2
      - name: Publish runtime safely
        run: |
          mkdir -p /tmp/medwork-runtime
          cp whisper.cpp/build-em/bin/libmain.js /tmp/medwork-runtime/libmain.js
          cp whisper.cpp/LICENSE /tmp/medwork-runtime/LICENSE-whisper.cpp.txt
          rm -rf whisper.cpp
          git fetch origin main
          git reset --hard origin/main
          mkdir -p vendor/whisper
          cp /tmp/medwork-runtime/libmain.js vendor/whisper/libmain.js
          cp /tmp/medwork-runtime/LICENSE-whisper.cpp.txt vendor/whisper/LICENSE-whisper.cpp.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add vendor/whisper/libmain.js vendor/whisper/LICENSE-whisper.cpp.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Publica runtime diagnostico Whisper Android'
            git push origin main
          fi
